<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Crimson+Text:wght@400;600&display=swap"
            rel="stylesheet"
        />
        <title>Tabletop Kingdom</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <header class="site-header">
            <div class="site-header__inner">
                <div class="header-left">
                    <button
                        class="menu-btn"
                        id="menuBtn"
                        type="button"
                        aria-haspopup="dialog"
                        aria-expanded="false"
                    >
                        <span class="hamburger" aria-hidden="true">
                            <span></span><span></span><span></span>
                        </span>
                        <span class="menu-text">Meny</span>
                    </button>
                    <div class="searchbar">
                        <input
                            type="text"
                            placeholder="Sök efter produkt..."
                            id="searchInput"
                        />
                        <button class="search-btn" type="button">
                            <img src="assets/searchIcon.png" alt="Sök" />
                        </button>
                    </div>

                    <!-- Overlay + dropdown -->
                    <div class="menu-overlay" id="menuOverlay" hidden></div>

                    <div
                        class="menu-dropdown"
                        id="menuDropdown"
                        role="dialog"
                        aria-label="Kategorier"
                        hidden
                    >
                        <div class="menu-dropdown__head">
                            <div class="menu-dropdown__title">Kategorier</div>
                            <button
                                class="menu-close"
                                id="menuClose"
                                type="button"
                                aria-label="Stäng meny"
                            >
                                ✕
                            </button>
                        </div>

                        <ul class="menu-list" id="menuList">
                            <!-- JS fyller listan -->
                        </ul>
                    </div>
                </div>

                <img
                    src="assets/logga.png"
                    alt="Tabletop Kingdom"
                    id="siteLogo"
                    class="logo"
                />
                <div class="header-right">
                    <div class="view-toggle">
                        <button class="toggle-btn active">Kund</button>
                        <button class="toggle-btn admin">Admin</button>
                    </div>

                    <button id="cartBtn" type="button" class="cart-btn">
                        <img src="assets/cartIcon.png" alt="Kundvagn" />
                    </button>

                    <!-- Cart dropdown -->
                    <div id="cartOverlay" class="dropdown-overlay" hidden></div>

                    <div id="cartDropdown" class="cart-dropdown" hidden>
                        <div class="cart-dropdown__head">
                            <h3 class="cart-dropdown__title">Kundvagn</h3>
                            <button
                                id="cartClose"
                                class="cart-dropdown__close"
                                type="button"
                                aria-label="Stäng"
                            >
                                ✕
                            </button>
                        </div>

                        <div id="cartContent" class="cart-dropdown__content">
                            <p class="cart-empty">Din kundvagn är tom</p>
                        </div>
                    </div>
                </div>
            </div>
        </header>
        <main>
            <div class="page">
                <h2 id="pageTitle">Produkter</h2>
                <ul id="productList"></ul>
            </div>
            <!-- Product Modal -->
            <div id="productModalOverlay" class="modal-overlay" hidden></div>

            <div
                id="productModal"
                class="modal"
                role="dialog"
                aria-modal="true"
                aria-labelledby="modalTitle"
                hidden
            >
                <div class="modal__card">
                    <button
                        id="modalClose"
                        class="modal__close"
                        type="button"
                        aria-label="Stäng"
                    >
                        ✕
                    </button>

                    <div class="modal__grid">
                        <div class="modal__img" aria-hidden="true"></div>

                        <div class="modal__content">
                            <h2 id="modalTitle" class="modal__title">
                                Produkt
                            </h2>
                            <div id="modalPrice" class="modal__price">—</div>

                            <div class="modal__meta-row">
                                <span class="modal__label">Lagerstatus:</span>
                                <span id="modalStockStatus" class="modal__badge"
                                    >—</span
                                >
                            </div>

                            <div class="modal__label">Beskrivning</div>
                            <p id="modalDesc" class="modal__desc">—</p>

                            <div class="modal__meta-row">
                                <span class="modal__label">Kategori:</span>
                                <span id="modalCategory" class="modal__value"
                                    >—</span
                                >
                            </div>

                            <div class="modal__actions">
                                <button
                                    id="modalAddToCart"
                                    class="btn btn-primary"
                                    type="button"
                                >
                                    Lägg i kundvagn
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <footer><p>&copy; 2026 Tabletop Kingdom</p></footer>
        <script src="app.js"></script>
    </body>
</html>
